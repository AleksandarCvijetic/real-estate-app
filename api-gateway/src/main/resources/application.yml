spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
            - id: listing-service
              uri: lb://listing-service
              predicates:
                - Path=/api/listings/**
            - id: messaging-service
              uri: lb://messaging-service
              predicates:
                - Path=/api/messagings/**
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**
server:
  port: 8080
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
jwt:
  secret: ${JWT_SECRET}