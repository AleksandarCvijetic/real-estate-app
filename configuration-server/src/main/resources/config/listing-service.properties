server.port=8082

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/listing_service_db
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# JWT
jwt.secret=${JWT_SECRET}

#Kafka
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# Prepisi TACNO onaj value-serializer koji koristis u Messaging servisu
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Bez Spring-ovih __TypeId__ header-a - Python strani ne trebaju
spring.kafka.producer.properties.spring.json.add.type.headers=false

app.kafka.topics.listing-events=listing-events

spring.kafka.producer.properties.max.block.ms=5000

# Slike oglasa
app.upload.dir=uploads/listings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB